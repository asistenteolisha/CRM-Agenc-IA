<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenc-IA 3D Logo</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #0A0E1A; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
// === Configuration ===
const CONFIG = {
  rotSpeed: 0.005,
  pulseSpeed: 0.02,
  glowIntensity: 0.6,
};

// === Color Palette ===
const PALETTE = {
  bg: [10, 14, 26],
  neonBlue: [0, 212, 255],
  neonPurple: [139, 92, 246],
  white: [248, 250, 252],
};

// === Global State ===
let angle = 0;
let pulse = 0;
let particles = [];

function setup() {
  createCanvas(800, 400, WEBGL);
  pixelDensity(2);
  
  // Create particles
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: random(-400, 400),
      y: random(-200, 200),
      z: random(-200, 200),
      size: random(1, 3),
      speed: random(0.2, 1),
      hue: random(180, 220),
    });
  }
}

function draw() {
  background(PALETTE.bg[0], PALETTE.bg[1], PALETTE.bg[2]);
  
  // Camera
  camera(0, 0, 600, 0, 0, 0, 0, 1, 0);
  
  // Lighting
  ambientLight(30);
  pointLight(0, 212, 255, -200, -200, 200);
  pointLight(139, 92, 246, 200, 200, 200);
  
  // Update
  angle += CONFIG.rotSpeed;
  pulse += CONFIG.pulseSpeed;
  
  // Draw particles
  push();
  for (let p of particles) {
    let y = p.y + sin(frameCount * 0.02 + p.x * 0.01) * 20;
    let alpha = map(sin(pulse + p.x * 0.01), -1, 1, 50, 200);
    
    push();
    translate(p.x, y, p.z);
    noStroke();
    fill(p.hue, 80, 100, alpha);
    sphere(p.size);
    pop();
  }
  pop();
  
  // Draw logo
  push();
  rotateY(angle);
  rotateX(sin(angle * 0.5) * 0.1);
  
  // "Agenc" text (dark)
  push();
  translate(-120, 0, 0);
  fill(PALETTE.white[0], PALETTE.white[1], PALETTE.white[2]);
  noStroke();
  textSize(72);
  textFont('Orbitron');
  textAlign(CENTER, CENTER);
  text('Agenc', 0, 0);
  pop();
  
  // "IA" text (neon gradient effect)
  push();
  translate(120, 0, 0);
  
  // Glow layers
  for (let i = 3; i >= 0; i--) {
    let alpha = map(i, 0, 3, 255, 50);
    let size = 72 + i * 4;
    
    push();
    fill(0, 212, 255, alpha * 0.3);
    noStroke();
    textSize(size);
    textFont('Orbitron');
    textAlign(CENTER, CENTER);
    text('IA', 0, 0);
    pop();
  }
  
  // Main text
  fill(0, 212, 255);
  noStroke();
  textSize(72);
  textFont('Orbitron');
  textAlign(CENTER, CENTER);
  text('IA', 0, 0);
  
  // Underline
  push();
  translate(0, 30, 0);
  stroke(0, 212, 255);
  strokeWeight(3);
  let lineLen = map(sin(pulse), -1, 1, 60, 100);
  line(-lineLen, 0, lineLen, 0);
  pop();
  
  pop();
  
  // Orbiting dots
  push();
  for (let i = 0; i < 6; i++) {
    let a = angle * 2 + (TWO_PI / 6) * i;
    let r = 180;
    let x = cos(a) * r;
    let z = sin(a) * r;
    let y = sin(a * 2 + pulse) * 30;
    
    push();
    translate(x, y, z);
    noStroke();
    let c = lerpColor(
      color(0, 212, 255),
      color(139, 92, 246),
      map(i, 0, 5, 0, 1)
    );
    fill(c);
    sphere(4 + sin(pulse + i) * 2);
    pop();
  }
  pop();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
