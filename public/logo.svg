<svg viewBox="0 0 240 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#00BFFF"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow -->
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <ellipse cx="175" cy="25" rx="40" ry="20" fill="rgba(0,212,255,0.1)" filter="url(#glowStrong)"/>
  
  <!-- Text "Agenc" -->
  <text x="10" y="38" 
        font-family="'Orbitron', 'Rajdhani', sans-serif" 
        font-weight="800" 
        font-size="36" 
        fill="#1E293B"
        letter-spacing="2">
    Agenc
  </text>
  
  <!-- Text "IA" with neon -->
  <text x="155" y="38" 
        font-family="'Orbitron', 'Rajdhani', sans-serif" 
        font-weight="800" 
        font-size="36" 
        fill="url(#neonGrad)"
        filter="url(#glow)"
        letter-spacing="2">
    IA
  </text>
  
  <!-- Decorative line under IA -->
  <line x1="155" y1="44" x2="210" y2="44" 
        stroke="url(#neonGrad)" 
        stroke-width="2" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Small dot accent -->
  <circle cx="215" cy="25" r="3" fill="#00D4FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
