<svg viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#00BFFF"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow -->
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="70%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background glow -->
  <ellipse cx="200" cy="30" rx="80" ry="30" fill="url(#bgGlow)"/>
  
  <!-- Circuit lines (decorative) -->
  <g stroke="rgba(0,212,255,0.2)" stroke-width="1" fill="none">
    <path d="M 10 45 L 30 45 L 30 35 L 50 35"/>
    <circle cx="50" cy="35" r="2" fill="rgba(0,212,255,0.3)"/>
    <path d="M 230 15 L 250 15 L 250 25 L 270 25"/>
    <circle cx="270" cy="25" r="2" fill="rgba(0,212,255,0.3)"/>
  </g>
  
  <!-- Text "Agenc" -->
  <text x="15" y="42" 
        font-family="'Orbitron', 'Rajdhani', sans-serif" 
        font-weight="800" 
        font-size="40" 
        fill="#1E293B"
        letter-spacing="3">
    Agenc
  </text>
  
  <!-- Text "IA" with neon -->
  <text x="175" y="42" 
        font-family="'Orbitron', 'Rajdhani', sans-serif" 
        font-weight="800" 
        font-size="40" 
        fill="url(#neonGrad)"
        filter="url(#glow)"
        letter-spacing="3">
    IA
  </text>
  
  <!-- Neon underline -->
  <line x1="175" y1="50" x2="235" y2="50" 
        stroke="url(#neonGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Dot accent with pulse -->
  <circle cx="240" cy="30" r="4" fill="#00D4FF" filter="url(#glowStrong)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Small decorative dots -->
  <circle cx="250" cy="20" r="1.5" fill="rgba(0,212,255,0.5)"/>
  <circle cx="260" cy="35" r="1" fill="rgba(139,92,246,0.5)"/>
</svg>
